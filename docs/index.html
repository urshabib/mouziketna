    <script>
      // 1. GitHub Pages Trailing Slash & Subpath Normalizer
      // Prevents 404 asset failures when visited at https://username.github.io/repo without trailing slash
      (function() {
        var l = window.location;
        var p = l.pathname;
        if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
          l.replace(p + '/' + l.search + l.hash);
          return;
        }

        // 2. SPA URL Recovery for GitHub Pages 404 redirects
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }

        // 3. Dynamic Chunk Loading Auto-Recovery (Purges stale service worker caches on deployment)
        window.addEventListener('error', function(e) {
          if (e && e.message && (
            e.message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            e.message.indexOf('Loading chunk') !== -1 ||
            e.message.indexOf('Importing a module script failed') !== -1
          )) {
            if (!sessionStorage.getItem('__mouzika_chunk_reload')) {
              sessionStorage.setItem('__mouzika_chunk_reload', '1');
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  return Promise.all(names.map(function(n) { return caches.delete(n); }));
                }).finally(function() {
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            }
          }
        }, true);
      })();
    </script>

  <body class="bg-black text-white antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script>
      // Global PWA prompt capture
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // Register Service Worker for PWA installability on Android & iOS
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .then(function(reg) {
              console.log('[MOUZIKA] PWA Service Worker active with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[MOUZIKA] Service Worker registration notice:', err);
            });
        });
      }
    </script>
