    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Immediate trailing-slash normalization for GitHub Pages and subpath hosting
      (function() {
        var path = window.location.pathname;
        if (path && path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <title>MOUZIKETNA</title>
    <meta name="description" content="A sleek, high-performance music streaming and offline player with synchronized lyrics, YouTube playlist import, and iOS-inspired design." />

  <body class="bg-black text-white antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script>
      // Fallback for static hosting directly from repo root or non-Vite static hosts
      (function() {
        function checkAndLoadStaticFallback() {
          if (window.__mouzikaLoaded) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount === 0) {
            window.__mouzikaLoaded = true;
            console.log('[MOUZIKA] Loading static production assets fallback...');
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.crossOrigin = '';
            css.href = './assets/index.css';
            document.head.appendChild(css);

            var script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = '';
            script.src = './assets/index.js';
            document.body.appendChild(script);
          }
        }
        // On GitHub Pages or static hosts without Vite dev server, load immediately
        var isStaticHost = window.location.hostname.indexOf('github.io') !== -1 ||
                           (window.location.protocol === 'file:') ||
                           (!window.__vite_plugin_react_preamble_installed__ && window.location.port !== '3000');
        if (isStaticHost && window.location.hostname.indexOf('run.app') === -1 && window.location.hostname !== 'localhost') {
          checkAndLoadStaticFallback();
        }

        window.addEventListener('error', function(e) {
          if (e && e.filename && (e.filename.indexOf('main.tsx') !== -1 || e.filename.indexOf('.tsx') !== -1)) {
            checkAndLoadStaticFallback();
          }
        });
        setTimeout(function() {
          if (!window.__vite_plugin_react_preamble_installed__) {
            checkAndLoadStaticFallback();
          }
        }, 400);
      })();
    </script>
    <script>
      // Global PWA prompt capture
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // Register Service Worker for PWA installability on Android & iOS
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .then(function(reg) {
              console.log('[MOUZIKA] PWA Service Worker active with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[MOUZIKA] Service Worker registration notice:', err);
            });
        });
      }
    </script>
  </body>
