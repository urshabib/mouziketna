    <script>
      // 1. GitHub Pages Trailing Slash & Subpath Normalizer
      // Prevents 404 asset failures when visited at https://username.github.io/repo without trailing slash
      (function() {
        var l = window.location;
        var p = l.pathname;

        // Auto-fix for PWA shortcut /assets white page issue: normalize /assets to app root immediately
        if (p.endsWith('/assets') || p.endsWith('/assets/')) {
          var cleanRoot = p.replace(/\/assets\/?$/, '/');
          l.replace(l.origin + cleanRoot + l.search + l.hash);
          return;
        }

        if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
          l.replace(p + '/' + l.search + l.hash);
          return;
        }

        // 2. SPA URL Recovery for GitHub Pages 404 redirects
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }

        // 3. Dynamic Chunk Loading Auto-Recovery (Purges stale service worker caches on deployment)
        window.addEventListener('error', function(e) {
          if (e && e.message && (
            e.message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            e.message.indexOf('Loading chunk') !== -1 ||
            e.message.indexOf('Importing a module script failed') !== -1
          )) {
            if (!sessionStorage.getItem('__mouzika_chunk_reload')) {
              sessionStorage.setItem('__mouzika_chunk_reload', '1');
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  return Promise.all(names.map(function(n) { return caches.delete(n); }));
                }).finally(function() {
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            }
          }
        }, true);
      })();
    </script>

    <script>window.__MOUZIKETNA_BUILD_TIME__ = '1791575734648';</script>
    <script>
      (function() {
        var isDev = location.port === '3000' ||
                    location.hostname === 'localhost' ||
                    location.hostname === '127.0.0.1' ||
                    location.hostname.includes('run.app');

        function mountProductionAssets() {
          if (window.__MOUZIKETNA_BUNDLE_INJECTED__) return;
          window.__MOUZIKETNA_BUNDLE_INJECTED__ = true;

          var q = new URLSearchParams(window.location.search);
          var queryBust = q.get('_v') || q.get('v') || q.get('_bust');
          var assetSuffix = '?v=' + (queryBust || window.__MOUZIKETNA_BUILD_TIME__ || '1.2.2');

          var basePrefix = './assets/';
          if (window.location.pathname.endsWith('/assets') || window.location.pathname.endsWith('/assets/')) {
            basePrefix = './';
          }

          if (!document.querySelector('link[href*="index.css"]')) {
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.crossOrigin = 'anonymous';
            css.href = basePrefix + 'index.css' + assetSuffix;
            document.head.appendChild(css);
          }
          if (!document.querySelector('script[src*="index.js"]')) {
            var js = document.createElement('script');
            js.type = 'module';
            js.crossOrigin = 'anonymous';
            js.src = basePrefix + 'index.js' + assetSuffix;
            document.body.appendChild(js);
          }
        }

        window.__mountProductionAssets = mountProductionAssets;

        // In static hosting environments (e.g. GitHub Pages root deployment), load production bundle immediately
        if (!isDev) {
          mountProductionAssets();
        }
      })();
    </script>
    <script>
      // Global PWA prompt capture
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // Register Service Worker for offline PWA functionality safely
      if ('serviceWorker' in navigator) {
        if (location.port !== '3000') {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
              .then(function(reg) {
                console.log('[MOUZIKETNA] PWA Service Worker active with scope:', reg.scope);
              })
              .catch(function(err) {
