<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MOUZIKETNA</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function() {
        var l = window.location;
        // Don't redirect if it looks like a missing static asset/media file
        var lastPart = l.pathname.split('/').pop();
        if (lastPart && lastPart.indexOf('.') !== -1 && !lastPart.endsWith('.html')) {
          return;
        }

        var isProjectPage = l.hostname.indexOf('github.io') !== -1 && l.pathname.split('/').length > 2;
        var segments = isProjectPage ? 1 : 0;

        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segments).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segments).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body style="background-color: #000; color: #fff;">
  </body>
</html>
