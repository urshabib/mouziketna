<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>MOUZIKA</title>
    <meta name="description" content="A sleek, high-performance music streaming and offline player with synchronized lyrics, YouTube playlist import, and iOS-inspired design." />
    <meta property="og:title" content="MOUZIKA" />
    <meta property="og:description" content="A sleek, high-performance music streaming and offline player with synchronized lyrics, YouTube playlist import, and iOS-inspired design." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MOUZIKA" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta property="og:image" content="./icon-512.png" />
    <meta name="twitter:image" content="./icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  </head>
  <body class="bg-black text-white antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Global PWA prompt capture
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // Register Service Worker for PWA installability on Android & iOS
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .then(function(reg) {
              console.log('[MOUZIKA] PWA Service Worker active with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[MOUZIKA] Service Worker registration notice:', err);
            });
        });
      }

      (function() {
        function loadStaticBundle() {
          if (window.__bundleLoaded) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount === 0) {
            window.__bundleLoaded = true;
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.crossOrigin = '';
            l.href = './assets/index.css';
            document.head.appendChild(l);

            var s = document.createElement('script');
            s.type = 'module';
            s.crossOrigin = '';
            s.src = './assets/index.js';
            document.body.appendChild(s);
          }
        }
        window.addEventListener('error', function(e) {
          if (e && e.filename && (e.filename.indexOf('main.tsx') !== -1 || e.filename.indexOf('.tsx') !== -1)) {
            loadStaticBundle();
          }
        });
        setTimeout(loadStaticBundle, 500);
      })();
    </script>
  </body>
</html>
