<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#24140b"/>
      <stop offset="55%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#060607"/>
    </radialGradient>

    <!-- Pulse Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradient for Waveform -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8c3c"/>
      <stop offset="50%" stop-color="#ff6b1a"/>
      <stop offset="100%" stop-color="#ff4f00"/>
    </linearGradient>

    <!-- Soft Aura behind pulse -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ff6b1a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff6b1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>

  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="508" height="508" rx="113" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>

  <!-- Radial Glow Behind Wave -->
  <circle cx="256" cy="256" r="180" fill="url(#aura)"/>

  <!-- Pulse Icon (scaled from 24x24: scale ~ 13.5, centered at 256, 256) -->
  <!-- 24 * 13.5 = 324 width. offset = (512 - 324)/2 = 94 -->
  <g transform="translate(94, 94) scale(13.5)" filter="url(#glow)">
    <path d="M9 7.53861L15 21.5386L18.6594 13H23V11H17.3406L15 16.4614L9 2.46143L5.3406 11H1V13H6.6594L9 7.53861Z" fill="url(#pulseGrad)"/>
  </g>
</svg>
